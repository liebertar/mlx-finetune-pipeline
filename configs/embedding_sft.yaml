flavor: embedding       # NLP embedding-model tuning
model: mlx-community/bge-small-en-v1.5

data:
  source: data/samples/embedding_pairs.jsonl  # {"text": ..., "positive": ...}
  format: pairs
  valid_split: 0.1
  test_split: 0.1

train:
  method: lora
  rank: 8
  iters: 200
  batch_size: 8
  learning_rate: 2.0e-5

gate:
  min_eval_accuracy: 0.7   # retrieval accuracy on held-out pairs

publish:
  repo_id: your-org/bge-small-demo-tuned
  private: true
