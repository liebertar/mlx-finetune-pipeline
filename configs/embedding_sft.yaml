flavor: embedding       # NLP embedding-model tuning
model: mlx-community/bge-small-en-v1.5

data:
  source: data/samples/embedding_pairs.jsonl  # {"text": ..., "positive": ...}
  format: pairs
  dedup: true
  valid_split: 0.1
  test_split: 0.1

# Embedding/contrastive recipe (docs/TUNING.md): smaller LR than SFT,
# low rank is usually enough.
train:
  method: lora
  rank: 8
  scale: 2.0
  learning_rate: 2.0e-5
  iters: 200
  batch_size: 8
  seed: 42

gate:
  min_eval_accuracy: 0.7   # retrieval accuracy on held-out pairs

publish:
  repo_id: your-hf-username/bge-small-demo-tuned
  private: true
