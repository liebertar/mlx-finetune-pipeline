[project]
name = "mlx-finetune-pipeline"
version = "0.1.0"
description = "Fine-tune LLM, NLP, and vision models on Apple Silicon with MLX, orchestrated with ZenML + MLflow, published to the Hugging Face Hub."
requires-python = ">=3.11"
dependencies = [
    "mlx-lm>=0.31",
    "mlx-vlm>=0.4",
    # mlx-lm 0.31 is incompatible with transformers 5.x (tokenizer registration API)
    "transformers>=4.57,<5",
    "zenml[server]>=0.75",
    "mlflow>=3.0",
    "huggingface_hub>=0.30",
    "matplotlib>=3.9",
    "datasets>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
